name: Automações do Stasis

on:
  schedule:
    # Minutos deslocados evitam a fila mais congestionada dos múltiplos de 5.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: stasis-discord-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Baixar as automações
        uses: actions/checkout@v4

      - name: Processar lembretes e mensagens privadas
        env:
          FIREBASE_PROJECT_ID: stasisrpg
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_SERVICE_EMAIL: ${{ secrets.FIREBASE_SERVICE_EMAIL }}
          FIREBASE_SERVICE_PASSWORD: ${{ secrets.FIREBASE_SERVICE_PASSWORD }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: 1019386388602425365
          TIME_ZONE: America/Sao_Paulo
        run: node run.mjs
